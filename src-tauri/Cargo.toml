[package]
name = "chenxiaoxue-reborn"
version = "1.0.0"
description = "Chen筱雪 Reborn - 基于 FastAPI + MCP 的多模型 AI 助手"
authors = ["ChenXiaoxue"]
edition = "2021"

[lib]
name = "chenxiaoxue_reborn_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
